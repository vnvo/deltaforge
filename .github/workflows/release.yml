name: Release

on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY_GHCR: ghcr.io
  REGISTRY_DOCKER: docker.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ============================================================
  # Run tests before release
  # ============================================================
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Run tests
        run: cargo test --workspace

      - name: Clippy
        run: cargo clippy --workspace -- -D warnings

  # ============================================================
  # Build and push Docker images (multi-arch)
  # ============================================================
  docker:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract version info
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          if [[ "$VERSION" == *"-"* ]]; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
          fi

      # --------------------------------------------------------
      # Minimal image (scratch-based, ~57MB)
      # --------------------------------------------------------
      - name: Docker meta (minimal)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}
            ${{ secrets.DOCKERHUB_USERNAME }}/deltaforge
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ steps.version.outputs.is_prerelease == 'false' }}

      - name: Build and push (minimal)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=minimal
          cache-to: type=gha,mode=max,scope=minimal

      # --------------------------------------------------------
      # Debug image (debian-slim, ~140MB)
      # --------------------------------------------------------
      - name: Docker meta (debug)
        id: meta-debug
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}
            ${{ secrets.DOCKERHUB_USERNAME }}/deltaforge
          tags: |
            type=semver,pattern={{version}},suffix=-debug
            type=semver,pattern={{major}}.{{minor}},suffix=-debug
            type=raw,value=latest-debug,enable=${{ steps.version.outputs.is_prerelease == 'false' }}

      - name: Build and push (debug)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.debug
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta-debug.outputs.tags }}
          labels: ${{ steps.meta-debug.outputs.labels }}
          cache-from: type=gha,scope=debug
          cache-to: type=gha,mode=max,scope=debug

  # ============================================================
  # Create GitHub Release
  # ============================================================
  release:
    needs: docker
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          TAG=${GITHUB_REF#refs/tags/}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          if [[ "$VERSION" == *"-"* ]]; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
          fi

      # The notes are the release's own scope and limits
      # (.github/release-notes/<tag>.md, required), the image pull commands,
      # and the tag's CHANGELOG section (required, its relative links pointed
      # at the tagged source); never a commit-subject dump or generated notes.
      - name: Generate release notes
        id: changelog
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          VERSION="${{ steps.version.outputs.version }}"
          SCOPE=".github/release-notes/${TAG}.md"
          if [ ! -s "$SCOPE" ]; then
            echo "missing release scope notes: $SCOPE" >&2
            exit 1
          fi
          awk -v h="## [${TAG}]" '
            index($0, h) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md \
            | perl -pe 's{\]\((?!https?://|#|mailto:)([^)\s]+)\)}{](https://github.com/vnvo/deltaforge/blob/'"$TAG"'/$1)}g' \
            > CHANGES.md
          if ! grep -q '[^[:space:]]' CHANGES.md; then
            echo "CHANGELOG.md has no section for ${TAG}" >&2
            exit 1
          fi
          {
            cat "$SCOPE"
            echo ""
            echo "## Docker Images"
            echo ""
            echo "**Minimal** (scratch-based):"
            echo "\`\`\`bash"
            echo "docker pull ghcr.io/vnvo/deltaforge:${VERSION}"
            echo "docker pull ${{ secrets.DOCKERHUB_USERNAME }}/deltaforge:${VERSION}"
            echo "\`\`\`"
            echo ""
            echo "**Debug** (includes shell):"
            echo "\`\`\`bash"
            echo "docker pull ghcr.io/vnvo/deltaforge:${VERSION}-debug"
            echo "docker pull ${{ secrets.DOCKERHUB_USERNAME }}/deltaforge:${VERSION}-debug"
            echo "\`\`\`"
            echo ""
            echo "## Changes"
            cat CHANGES.md
          } > RELEASE_NOTES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          prerelease: ${{ steps.version.outputs.is_prerelease == 'true' }}
          make_latest: ${{ steps.version.outputs.is_prerelease == 'true' && 'false' || 'legacy' }}
          generate_release_notes: false