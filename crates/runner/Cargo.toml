[package]
name = "runner"
version = "0.1.0"
edition.workspace = true
license = "MIT OR Apache-2.0"

[features]
default = ["jemalloc"]
jemalloc = ["tikv-jemallocator"]
# Native Vault-triggered credential rotation. Off by default; build the binary
# with `--features vault` to enable connecting to Vault. Without it a
# Vault-configured rotation fails closed at startup.
vault = ["sources/vault"]

[dependencies]
metrics.workspace = true
tokio.workspace = true
tokio-util.workspace = true
chrono.workspace = true
async-trait.workspace = true
futures.workspace = true
uuid.workspace = true
serde.workspace = true
serde_json.workspace = true
parking_lot.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
axum.workspace = true
clap = { version = "4", features = ["derive"] }
deltaforge-core = { path = "../deltaforge-core" }
apache-avro.workspace = true
storage = { path = "../storage" }
schema-sensing = { path = "../schema-sensing" }
deltaforge-config = { path = "../deltaforge-config" }
o11y = { path = "../o11y" }
schema-registry = { path = "../schema-registry" }
sources = { path = "../sources" }
sinks = { path = "../sinks" }
secrets = { path = "../secrets" }
common = { path = "../common" }
zeroize = "1"
processors = { path = "../processors" }
arrow-schema = "58"
rest-api = { path = "../rest-api" }
checkpoints = { path = "../checkpoints" }
serde_yaml.workspace = true
tikv-jemallocator = { version = "0.6", optional = true }

[dev-dependencies]
# Fault-injecting backend for the process-level store-gate tests.
storage = { path = "../storage", features = ["testing"] }
tempfile = "3"
rdkafka.workspace = true
tokio-postgres = { version = "0.7", features = ["with-serde_json-1"] }
mysql_async = "0.36"
criterion = { version = "0.5", features = ["async_tokio"] }
testcontainers = "0.25"
ctor = "0.6"
reqwest.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
mysql-binlog-connector-rust = "0.3"
bytes.workspace = true
object_store = { version = "0.13", features = ["aws"] }
parquet = { version = "58", features = ["async", "object_store"] }
arrow-array = "58"
flate2 = "1"
# MiniStack canary test SigV4 helpers
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
url = "2"

[[bench]]
name = "pipeline_e2e"
harness = false

[lints]
workspace = true