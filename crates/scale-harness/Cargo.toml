[package]
name = "scale-harness"
version = "0.1.0"
edition.workspace = true
license = "MIT OR Apache-2.0"
description = "Dense-catalog measurement harness: synthetic durable schema registries and scale scenarios"
publish = false

[[bin]]
name = "registry-scale"
path = "src/bin/registry-scale.rs"

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["full"] }
chrono.workspace = true
sha2.workspace = true
hex.workspace = true
clap = { version = "4", features = ["derive"] }
storage = { path = "../storage" }
# Scenario 8 (live databases, scale tier only).
sources = { path = "../sources" }
runner = { path = "../runner" }
checkpoints = { path = "../checkpoints" }
deltaforge-core = { path = "../deltaforge-core" }
deltaforge-config = { path = "../deltaforge-config" }
testcontainers = "0.25"
gate-ownership = { path = "../gate-ownership" }
tokio-postgres = "0.7"
mysql_async = "0.36"
tokio-util.workspace = true

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
