[package]
name = "secrets"
version = "0.1.0"
edition.workspace = true
license = "MIT OR Apache-2.0"

# Slice 1 (core secret model) deliberately has NO provider dependencies.
# Vault/Kubernetes support arrives in later slices behind optional features or a
# separate provider crate, so environment/file users never pull those runtimes.
[features]
default = []

[dependencies]
serde.workspace = true
async-trait.workspace = true
thiserror.workspace = true
# Best-effort zeroization of owned secret buffers. Tiny, pure crate with no
# transitive provider/runtime deps; keeps this crate free of `unsafe` (workspace
# denies unsafe_code) and unrelated to Vault/Kubernetes.
zeroize = "1"

[dev-dependencies]
serde_json.workspace = true
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
