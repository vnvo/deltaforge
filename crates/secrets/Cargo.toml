[package]
name = "secrets"
version = "0.1.0"
edition.workspace = true
license = "MIT OR Apache-2.0"

# Built-in providers (environment variables, mounted files) have no runtime
# dependencies beyond std + serde_json (for structured JSON files). Vault support
# arrives in a later slice behind an optional feature or a separate provider crate,
# so environment/file users never pull that runtime. Kubernetes is not a provider
# (it injects via env / projected-volume files).
[features]
default = []

[dependencies]
serde.workspace = true
async-trait.workspace = true
thiserror.workspace = true
# Parses bounded structured-record files (JSON objects) for selector-based file
# references. Pure, ubiquitous, already a workspace dependency.
serde_json.workspace = true
# `rt` only: file resolution runs its blocking filesystem work on
# `spawn_blocking` so a slow/unhealthy mount cannot stall a Tokio worker thread.
# No macros/net/multi-thread runtime pulled in for library use.
tokio = { version = "1", features = ["rt", "time"] }
# Best-effort zeroization of owned secret buffers. Tiny, pure crate with no
# transitive provider/runtime deps; keeps this crate free of `unsafe` (workspace
# denies unsafe_code) and unrelated to Vault/Kubernetes.
zeroize = "1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "time"] }

[lints]
workspace = true
