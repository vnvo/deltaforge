[package]
name = "secrets"
version = "0.1.0"
edition.workspace = true
license = "MIT OR Apache-2.0"

# Built-in providers (environment variables, mounted files) have no runtime
# dependencies beyond std + serde_json (for structured JSON files). Vault support
# arrives in a later slice behind an optional feature or a separate provider crate,
# so environment/file users never pull that runtime. Kubernetes is not a provider
# (it injects via env / projected-volume files).
[features]
default = []
# Native HashiCorp Vault provider. Off by default so environment/file users pull
# no network/HTTP runtime; enabling it adds the workspace `reqwest` (already in the
# tree, reused here to avoid a second HTTP/TLS stack). All Vault I/O is isolated
# behind internal client traits.
vault = ["dep:reqwest", "dep:tracing"]

[dependencies]
serde.workspace = true
async-trait.workspace = true
thiserror.workspace = true
# Parses bounded structured-record files (JSON objects) for selector-based file
# references. Pure, ubiquitous, already a workspace dependency.
serde_json.workspace = true
# `rt` only: file resolution runs its blocking filesystem work on
# `spawn_blocking` so a slow/unhealthy mount cannot stall a Tokio worker thread.
# No macros/net/multi-thread runtime pulled in for library use.
tokio = { version = "1", features = ["rt", "time"] }
# Best-effort zeroization of owned secret buffers. Tiny, pure crate with no
# transitive provider/runtime deps; keeps this crate free of `unsafe` (workspace
# denies unsafe_code) and unrelated to Vault/Kubernetes.
zeroize = "1"
# Optional: native Vault provider (KV v2 + auth) HTTP client. Feature-gated via
# `vault`; never pulled into the default build. Reuses the workspace reqwest
# (0.12, rustls-tls, json) so enabling Vault does not introduce a second HTTP/TLS
# stack. Per the RFC dependency review: a small direct client over the ~4 Phase-1
# endpoints is preferred to a Vault SDK that pins a divergent reqwest major.
reqwest = { workspace = true, optional = true }
# Optional: secret-free observability for the Vault token lifecycle (auth /
# renewal / reauth). Feature-gated via `vault`; the default build stays free of it.
tracing = { version = "0.1", optional = true }

[dev-dependencies]
gate-ownership = { path = "../gate-ownership" }
tokio = { version = "1", features = [
    "macros",
    "rt",
    "rt-multi-thread",
    "time",
    "net",
    "io-util",
] }
# Vault live/e2e tests (feature `vault`, `#[ignore]` docker tests + hermetic
# local HTTP servers). reqwest drives admin setup against a dev-mode Vault;
# testcontainers runs it; tempfile backs token/JWT files.
reqwest = { workspace = true }
testcontainers = "0.25"
tempfile = "3"

[lints]
workspace = true
