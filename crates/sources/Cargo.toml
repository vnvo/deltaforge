[package]
name = "sources"
version = "0.1.0"
edition.workspace = true
license = "MIT OR Apache-2.0"

[features]
default = []
# Native Vault-triggered credential rotation. Enables the secrets crate's Vault
# provider so a `trigger: { type: vault }` rotation can connect and poll. Off by
# default; a Vault-configured rotation fails closed in a build without it.
vault = ["secrets/vault"]

[dependencies]
scopeguard = "1"
metrics.workspace = true
lru.workspace = true
async-trait.workspace = true
tokio.workspace = true
tokio-util.workspace = true
deltaforge-config = { path = "../deltaforge-config" }
deltaforge-core = { path = "../deltaforge-core" }
# Static credential resolution (env/file references) at source startup.
secrets = { path = "../secrets" }
# Best-effort zeroization of the reconstructed protected DSN string.
zeroize = "1"
checkpoints = { path = "../checkpoints" }
schema-registry = { path = "../schema-registry" }
storage ={ path = "../storage"}
common = { path = "../common" }
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
mysql-binlog-connector-rust = "0.3"
crc32fast = "1.5"
mysql_async = "0.36"
base64.workspace = true
url.workspace = true
mysql_common = { version = "0.35", features = ["binlog"] }
bytes.workspace = true
rand = "0.9.2"
hex = "0.4"
uuid.workspace = true
sha2 = "0.10"
pgwire-replication = "0.4.0"
tokio-postgres = { version = "0.7", features = ["with-serde_json-1"] }

[dev-dependencies]
gate-ownership = { path = "../gate-ownership" }
# Same crate as the normal dependency, plus the fault-injecting test backend.
storage = { path = "../storage", features = ["testing"] }
ctor = "0.6"
metrics-util = "0.19"
testcontainers = "0.25"
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = [
    "env-filter",
    "fmt",
    "json",
] }
tempfile = "3"
# Vault admin setup (write KV, create/rotate secrets) for the live Vault+source
# integration test.
reqwest = { workspace = true }
processors ={ path = "../processors"}
# Dev-only: source→coordinator acceptance tests exercise the real coordinator.
# This is a dev-dependency cycle (runner depends on sources), which Cargo allows
# because dev-dependencies are excluded from the normal build graph.
runner = { path = "../runner" }
# Dev-only, the same kind of cycle: the counting storage backend for the
# snapshot's structural operation counts.
scale-harness = { path = "../scale-harness" }

[lints]
workspace = true
